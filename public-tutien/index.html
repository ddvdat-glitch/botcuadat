<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>☯ Tu Tiên — Cấu hình hệ thống</title>
<style>
:root{--bg:#0a0a14;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--in:#12121f;--tx:#eceaf7;--mu:#8c89a8;--ac:#8b5cf6;--ac2:#6366f1;--rd:#ef4444;--gr:#22c55e;--am:#fbbf24}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 10% -10%,#2a1a5e55,transparent),radial-gradient(900px 500px at 100% 0,#0e2a5e44,transparent),var(--bg);min-height:100vh}
.w{max-width:1280px;margin:auto;padding:14px 16px 60px}
header{position:sticky;top:0;z-index:20;background:#0a0a14e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);margin:0 -16px;padding:10px 16px}
h1{font-size:19px;margin:0;font-weight:700;background:linear-gradient(90deg,#c4b5fd,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs button{background:transparent;border:1px solid var(--bd);color:var(--mu)}.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:8px;padding:6px 13px;cursor:pointer;font:inherit;font-weight:600}
button:hover{filter:brightness(1.12)}button.s{background:#2a2a3d;font-weight:500}button.d{background:#7f1d1d}button.g{background:#15803d}button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:6px 9px;font:inherit;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #8b5cf666;border-color:var(--ac)}
textarea{width:100%;min-height:70px;resize:vertical}textarea.code{font:12.5px/1.5 Consolas,monospace;min-height:260px;white-space:pre;tab-size:4}
input[type=color]{padding:0;width:38px;height:30px}input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}.g2 .wide{grid-column:1/-1}.g2 input:not([type=checkbox]):not([type=color]),.g2 select{width:100%}
label{display:block;color:var(--mu);font-size:11.5px;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}label input,label select{width:100%;text-transform:none;letter-spacing:0}
.mu{color:var(--mu);font-size:12.5px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;background:#2a2a3d;color:#cfcbe8;margin-right:4px}
details.rl{border:1px solid var(--bd);border-radius:12px;margin:8px 0;background:var(--card)}details.rl>summary{cursor:pointer;padding:10px 14px;list-style:none;display:flex;gap:10px;align-items:center}
details.rl>summary::-webkit-details-marker{display:none}details.rl[open]>summary{border-bottom:1px solid var(--bd)}.rb{padding:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:5px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}table.t th{color:var(--mu);font-weight:500;font-size:11.5px;text-transform:uppercase}
.ladder{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.ladder .rg{flex:0 0 auto;min-width:112px;border:1px solid var(--bd);border-radius:10px;padding:6px 9px;background:#ffffff08;border-top:3px solid var(--c)}.rg b{font-size:12.5px;display:block}.rg span{font-size:11px;color:var(--mu)}
.hint{background:#8b5cf61a;border:1px solid #8b5cf644;border-radius:10px;padding:8px 12px;color:#d4cbff;font-size:12.5px;margin:8px 0}
/* ---------- Trình thiết kế menu ---------- */
.ds{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:12px;align-items:start}
@media(max-width:1000px){.ds{grid-template-columns:1fr}}
.pnl input:not([type=checkbox]):not([type=color]),.pnl textarea,.pnl select{width:100%}.pnl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.sticky{position:sticky;top:112px}
.ml{display:flex;flex-direction:column;gap:5px}.ml button{text-align:left;background:#1c1c2e;font-weight:500}.ml button.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.stage{background:repeating-conic-gradient(#14141f 0 25%,#10101a 0 50%) 0 0/22px 22px;border:1px dashed #ffffff22;border-radius:14px;padding:22px 14px;min-height:420px}
.dc{max-width:560px;margin:auto;background:#313338;border-radius:8px;padding:14px 16px;color:#dbdee1;font:15px/1.4 "gg sans",system-ui,sans-serif;box-shadow:0 10px 40px #0008}
.dch{display:flex;align-items:center;gap:8px;margin-bottom:6px}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5865f2,#8b5cf6);display:grid;place-items:center;font-size:20px}.dch b{color:#fff}.bt{background:#5865f2;color:#fff;font-size:10px;padding:0 5px;border-radius:4px;font-style:normal;line-height:16px}
.el{border-radius:5px;cursor:pointer;outline:2px solid transparent;outline-offset:2px;transition:.12s;min-height:4px}.el:hover{outline-color:#8b5cf666}.el.on{outline-color:#a78bfa;background:#8b5cf61f}
.ph{color:#80848e;font-style:italic;font-size:13px}
.emb{background:#2b2d31;border-left:4px solid var(--ac);border-radius:4px;padding:10px 14px 12px;margin:6px 0;max-width:520px;position:relative}.emb.on{outline:2px solid #a78bfa;outline-offset:2px}
.emb .tt{color:#fff;font-weight:700;font-size:16px;margin:2px 0}.emb .ds_{font-size:14px;margin:4px 0;color:#dbdee1}.emb .fo{font-size:12px;color:#b5bac1;margin-top:8px}
.emb .au{font-size:13px;font-weight:600;color:#fff}.emb img{max-width:100%;border-radius:6px;margin-top:8px}.th{position:absolute;right:12px;top:12px;width:64px;height:64px;border-radius:6px;background:#3a3c43;display:grid;place-items:center;color:#888;font-size:11px;overflow:hidden}.th img{margin:0;width:100%;height:100%;object-fit:cover}
.flds{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:8px}.fld{flex:1 1 100%;padding:2px 4px}.fld.in{flex:1 1 30%;min-width:110px}.fld b{display:block;color:#fff;font-size:13px}.fld div{font-size:13.5px}
.rowb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:3px;border-radius:6px;min-height:34px;align-items:center}.rowb:hover{background:#ffffff08}
.dbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:4px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.addb,.newrow{color:#a78bfa;border:1px dashed #a78bfa88;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12.5px}.newrow{display:block;text-align:center;margin-top:10px}.addb:hover,.newrow:hover{background:#8b5cf622}
.dragover{outline:2px dashed #34d399!important}
.sw{display:inline-block;width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;vertical-align:middle}.sw:hover{border-color:#fff}.sw.on{border-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{background:#23233a;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font:11.5px Consolas,monospace;cursor:pointer;color:#c4b5fd}.chip:hover{background:#34345a}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;color:#fff;cursor:pointer;margin:2px;border:2px solid transparent}.pill.on{border-color:#fff}
.log{background:#0d0d18;border:1px solid var(--bd);border-radius:10px;padding:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;right:18px;bottom:18px;background:#1c1c2e;border:1px solid var(--bd);padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 8px 30px #000a}
</style></head><body><div class="w"><div id="app"></div></div><div id="toast" class="toast" style="display:none"></div>
<script src="/lib/infnum.js"></script>
<script>
const I=InfNum,$=id=>document.getElementById(id);
let pw=sessionStorage.ttpw||'',T=null,CH={},META={},tab='realms',MI=0,SEL={k:'embed'},SV={},SAMPLE={realm:3,tier:1},DR=null,LF=null,isDirty=false,PL=[],SIM={a:{realm:3,tier:1},b:{realm:4,tier:1}},SIMR=null,SENDCH='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v===''||isNaN(+v)?0:+v;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','x-password':pw},body:b?JSON.stringify(b):undefined});
 if(!r.ok){let e='Lỗi '+r.status;try{e=(await r.json()).error||e}catch{}throw new Error(e)}return r.json()}
function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
async function init(){try{const d=await api('GET','/api/tt');T=d.tutien;CH=d.channels||{};META=d;sessionStorage.ttpw=pw;await loadVars();draw()}catch(e){login(e.message)}}
function login(m){$('app').innerHTML=`<div class="card" style="max-width:380px;margin:12vh auto"><h1>☯ Tu Tiên</h1><p class="mu">Nhập mật khẩu quản trị (ADMIN_PASSWORD của bot)</p><div class="r"><input id="p" type="password" style="flex:1" onkeydown="if(event.key=='Enter'){pw=this.value;init()}"><button onclick="pw=$('p').value;init()">Vào</button></div>${m&&pw?`<p style="color:#f87171">${esc(m)}</p>`:''}</div>`}
// ---------- dữ liệu / lưu ----------
const G=p=>p.split('.').reduce((o,k)=>o?.[k],T);
function S(p,v){const k=p.split('.');let o=T;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=v;dirty(true);after(p)}
function dirty(f){isDirty=f;const b=$('sv');if(b){b.textContent=f?'💾 Lưu (chưa lưu)':'✔ Đã lưu';b.className=f?'':'s'}}
function after(p){if(p.startsWith('realms.')||p.startsWith('stats.'))refreshPreviews();if(p.startsWith('menus.')&&tab=='menus'){const c=$('cv');if(c)c.innerHTML=canvas()}}
async function save(){try{const r=await api('PUT','/api/tt',T);T=r.tutien;dirty(false);toast('✔ Đã lưu vào data.json — bot áp dụng ngay');if(tab=='menus')await loadVars();draw()}catch(e){toast('❌ '+e.message,4000)}}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();save()}});
window.addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue=''}});
// ---------- công thức giống bot (để xem trước) ----------
const bAt=(r,t)=>{const g=+r.growth||1,k=t-1;return (+r.b0||0)+(Math.abs(g-1)<1e-9?(+r.bStep||0)*k:(+r.bStep||0)*(Math.pow(g,k)-1)/(g-1))};
const tn=r=>Math.max(1,(r.tierNames||[]).filter(x=>String(x).trim()).length);
const stat=(r,t,s)=>I.norm([Math.trunc(+r.layer||0),bAt(r,t)+(+s.off||0)]);
const need=(r,t)=>I.norm([Math.trunc(+r.layer||0),(+r.expB0||0)+(+r.expStep||0)*(t-1)]);
const CAPN=['Cấp 0 · Phàm','Cấp 1 · Tiểu thiên','Cấp 2 · Đa nguyên','Cấp 3 · Thái Sơ'];
// ---------- ô nhập ----------
const inp=(p,o={})=>{const v=G(p),n=o.n;return `<input id="i_${p}" ${o.t=='color'?'type=color':''} style="${o.w?'width:'+o.w:''}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" oninput="S('${p}',${n?'num(this.value)':'this.value'})">`};
const lab=(t,h)=>`<label>${t}${h}</label>`;
const sel=(p,opts,o={})=>`<select onchange="S('${p}',${o.n?'+this.value':'this.value'});${o.redraw?'draw()':''}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)==String(G(p))?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const chk=(p,t,rd)=>`<label style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:13px;color:var(--tx)"><input type=checkbox ${G(p)?'checked':''} onchange="S('${p}',this.checked);${rd?'draw()':''}">${t}</label>`;
const ta=(p,o={})=>`<textarea id="i_${p}" class="${o.c||''}" oninput="S('${p}',${o.lines?"this.value.split('\\n')":'this.value'})" placeholder="${esc(o.ph||'')}">${esc(o.lines?(G(p)||[]).join('\n'):G(p))}</textarea>`;
const realmOpts=()=>T.realms.map((r,i)=>[i,`${i}. ${r.emoji||''} ${r.name}`]);
const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];dirty(true);draw()};
const rm=(arr,i,what)=>{if(confirm('Xóa '+what+'?')){arr.splice(i,1);dirty(true);if(arr===T.menus){MI=Math.max(0,Math.min(MI,arr.length-1));SEL={k:'embed'}}draw()}};
// ================= KHUNG =================
const TABS=[['realms','🌌 Cảnh giới'],['stats','📊 Chỉ số'],['abil','🌀 Khả năng'],['cmds','⌨️ Lệnh'],['menus','🎨 Thiết kế Menu'],['players','👥 Người chơi'],['sim','⚔️ Mô phỏng'],['set','⚙️ Cài đặt']];
function draw(){const y=scrollY;
 $('app').innerHTML=`<header><div class="top"><h1>☯ Tu Tiên · Cấu hình hệ thống</h1><span class="mu">dùng chung <code>data.json</code></span><span class="sp"></span>
 <span class="mu">${META.botReady?'🟢 bot online':'🔴 bot chưa online'}</span><a class="mu" href="#" onclick="location.href=location.protocol+'//'+location.hostname+':3000';return false">← Quản trị bot</a><button id="sv" class="${isDirty?'':'s'}" onclick="save()">${isDirty?'💾 Lưu (chưa lưu)':'✔ Đã lưu'}</button></div>
 <div class="tabs">${TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div></header>
 ${({realms:tRealms,stats:tStats,abil:tAbil,cmds:tCmds,menus:tMenus,players:tPlayers,sim:tSim,set:tSet})[tab]()}`;
 if(tab=='realms')refreshPreviews();scrollTo(0,y)}
async function go(t){tab=t;if(t=='players')PL=await api('GET','/api/tt/players').catch(()=>[]);if(t=='menus')await loadVars();draw()}
// ================= CẢNH GIỚI =================
function tRealms(){return `<div class="hint">Mỗi cảnh giới có <b>tầng vô hạn ∞ⁿ</b> riêng. Hơn nhau 1 tầng ∞ = hơn nhau <b>vô hạn lần</b> (đúng thiết lập: “mỗi tiểu cảnh giới đều cách vô hạn”). Trong cùng một tầng, chỉ số = <code>10^b</code> với <code>b = b0 + bStep·(growth^(tầng−1) − 1)/(growth − 1)</code>. Từ <b>Luyện Khí Hóa Thần</b> b0 đã là hàng triệu → chỉ số dạng <code>10^1,000,001</code> (tiến sát vô hạn).</div>
 <div class="ladder">${T.realms.map((r,i)=>`<div class="rg" style="--c:${esc(r.color)}"><b>${esc(r.emoji)} ${esc(r.name)}</b><span>${(Math.trunc(+r.layer||0))===0?'tầng 0':I.fmt([Math.trunc(+r.layer||0),0])} · cấp ${r.cap}${r.locked?' 🔒':''}</span></div>`).join('')}</div>
 ${T.realms.map((r,i)=>`<details class="rl" ${i==3?'open':''}><summary><span id="rh${i}"></span><span class="sp"></span><button class="s sm" onclick="event.preventDefault();mv(T.realms,${i},-1)">↑</button><button class="s sm" onclick="event.preventDefault();mv(T.realms,${i},1)">↓</button><button class="d sm" onclick="event.preventDefault();rm(T.realms,${i},'cảnh giới này')">🗑</button></summary><div class="rb">
 <div class="g2">
 <div>${lab('Tên','')}${inp(`realms.${i}.name`)}</div><div>${lab('Emoji','')}${inp(`realms.${i}.emoji`)}</div>
 <div>${lab('Cấp (0–3)','')}${inp(`realms.${i}.cap`,{n:1})}</div><div>${lab('Màu','')}${inp(`realms.${i}.color`,{t:'color'})}</div>
 <div>${lab('Tầng vô hạn ∞ⁿ','')}${inp(`realms.${i}.layer`,{n:1})}</div><div>${lab('b0 (log10 gốc)','')}${inp(`realms.${i}.b0`,{n:1})}</div>
 <div>${lab('bStep (tăng/tầng)','')}${inp(`realms.${i}.bStep`,{n:1})}</div><div>${lab('growth (nhân bước)','')}${inp(`realms.${i}.growth`,{n:1})}</div>
 <div>${lab('Tu vi cần: expB0','')}${inp(`realms.${i}.expB0`,{n:1})}</div><div>${lab('expStep','')}${inp(`realms.${i}.expStep`,{n:1})}</div>
 <div>${lab('Số lần tu luyện / tầng','')}${inp(`realms.${i}.trains`,{n:1})}</div><div>${lab('Tỉ lệ đột phá → tiếp (0–1)','')}${inp(`realms.${i}.chance`,{n:1})}</div>
 <div>${lab('Khóa (không thể lên)','')}${chk(`realms.${i}.locked`,'🔒 cấp 3')}</div>
 <div class="wide">${lab('Tên các tầng (mỗi dòng 1 tầng)','')}${ta(`realms.${i}.tierNames`,{lines:1})}</div>
 <div class="wide">${lab('Mô tả','')}${ta(`realms.${i}.desc`)}</div></div>
 <div id="pv${i}" style="margin-top:10px"></div></div></details>`).join('')}
 <button onclick="T.realms.push({id:'cg'+Date.now().toString(36),name:'Cảnh giới mới',emoji:'🔮',cap:2,color:'#8b5cf6',layer:10,b0:0,bStep:500,growth:1.5,tierNames:['Sơ kỳ','Trung kỳ','Hậu kỳ','Đại viên mãn'],expB0:0,expStep:300,trains:20,chance:.1,desc:'',locked:false});dirty(true);draw()">＋ Thêm cảnh giới</button>`}
function refreshPreviews(){if(tab!='realms')return;T.realms.forEach((r,i)=>{const h=$('rh'+i),p=$('pv'+i);if(h)h.innerHTML=`<b style="color:${esc(r.color)}">${esc(r.emoji)} ${esc(r.name)}</b> <span class="badge">${CAPN[r.cap]||'Cấp '+r.cap}</span><span class="badge">∞^${Math.trunc(+r.layer||0)}</span>${r.locked?'<span class="badge">🔒</span>':''}<span class="mu">${tn(r)} tầng</span>`;
 if(!p)return;const n=tn(r),sel=[1,Math.ceil(n/2),n].filter((x,j,a)=>a.indexOf(x)==j);
 p.innerHTML=`<table class="t"><tr><th>Chỉ số</th>${sel.map(t=>`<th>${esc((r.tierNames||[])[t-1]||'Tầng '+t)}</th>`).join('')}</tr>${T.stats.map(s=>`<tr><td>${esc(s.emoji)} ${esc(s.name)}</td>${sel.map(t=>`<td>${esc(I.fmt(stat(r,t,s)))}</td>`).join('')}</tr>`).join('')}<tr><td>🧘 Tu vi cần để lên tầng</td>${sel.map(t=>`<td>${esc(I.fmt(need(r,t)))}</td>`).join('')}</tr></table>`})}
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.rl'))refreshPreviews()},true);
// ================= CHỈ SỐ =================
function tStats(){return `<div class="hint">Mỗi chỉ số = <code>10^(b của cảnh giới + offset)</code>. Offset +1 nghĩa là gấp 10 lần mốc cảnh giới. 5 chỉ số đầu (hp, atk, def, spd, mp) <b>bắt buộc</b> để chiến đấu. Chỉ số mới có thể dùng trong menu bằng <code>{id}</code>.</div>
 <div class="card"><table class="t"><tr><th>ID</th><th>Tên</th><th>Emoji</th><th>Offset (log10)</th><th>Mô tả</th><th></th></tr>${T.stats.map((s,i)=>`<tr><td><code>{${esc(s.id)}}</code></td><td>${inp(`stats.${i}.name`)}</td><td>${inp(`stats.${i}.emoji`,{w:'60px'})}</td><td>${inp(`stats.${i}.off`,{n:1,w:'90px'})}</td><td>${inp(`stats.${i}.desc`)}</td><td>${i>4?`<button class="d sm" onclick="rm(T.stats,${i},'chỉ số')">🗑</button>`:''}</td></tr>`).join('')}</table>
 <p><button onclick="T.stats.push({id:'cs'+Date.now().toString(36).slice(-4),name:'Chỉ số mới',emoji:'🔸',off:0,desc:''});dirty(true);draw()">＋ Thêm chỉ số</button></p></div>

function addField(){const f=T.menus[MI].embed.fields;if(f.length>=25)return;f.push({name:'Tên trường',value:'{hp}',inline:true});SEL={k:'f:'+(f.length-1)};dirty(true);draw()}
function addRow(){const m=T.menus[MI];if(m.rows.length>=5)return;m.rows.push([newBtn()]);SEL={k:`b:${m.rows.length-1}:0`};dirty(true);draw()}
function addBtn(r){const m=T.menus[MI];if(r<0){if(!m.rows.length)return addRow();r=m.rows.findIndex(x=>x.length<5);if(r<0)return addRow()}if(m.rows[r].length>=5)return;m.rows[r].push(newBtn());SEL={k:`b:${r}:${m.rows[r].length-1}`};dirty(true);draw()}
function newMenu(){const n=prompt('Tên menu mới:','Menu mới');if(!n)return;T.menus.push({id:nid('menu'),name:n,ownerOnly:true,content:'',rows:[],embed:{enabled:true,color:'#8b5cf6',title:'{realmEmoji} '+n,description:'Xin chào **{name}**!',fields:[],footer:{text:'',icon:''},thumbnail:'',image:'',author:{name:'',icon:''},url:'',timestamp:false}});MI=T.menus.length-1;SEL={k:'embed'};dirty(true);draw()}
function dupMenu(){const c=JSON.parse(JSON.stringify(T.menus[MI]));c.id=nid('menu');c.name+=' (bản sao)';T.menus.push(c);MI=T.menus.length-1;dirty(true);draw()}
async function sendMenu(){const m=T.menus[MI];if(!SENDCH)return toast('Chọn kênh trước');await save();try{await api('POST','/api/tt/send-menu',{menuId:m.id,channelId:SENDCH});toast('📤 Đã gửi menu vào kênh')}catch(e){toast('❌ '+e.message,4000)}}
// ================= NGƯỜI CHƠI =================
function tPlayers(){return `<div class="card">${PL.length?`<table class="t"><tr><th>Tên</th><th>ID</th><th>Cảnh giới</th><th>Tầng</th><th>Tu vi</th><th>Thắng/Thua</th><th>Đạo ngấn</th><th></th></tr>${PL.map((p,i)=>`<tr><td>${esc(p.name)}</td><td class="mu">${esc(p.id)}</td><td><select id="pr${i}">${realmOpts().map(([a,b])=>`<option value="${a}" ${a==p.realm?'selected':''}>${esc(b)}</option>`).join('')}</select></td><td><input id="pt${i}" type=number min=1 style="width:62px" value="${p.tier}"></td><td>${esc(p.expText)}</td><td>${p.wins}/${p.losses}</td><td><input id="pd${i}" type=number min=0 style="width:62px" value="${p.dao}"></td><td class="r"><button class="sm" onclick="savePl(${i})">Lưu</button><button class="s sm" onclick="resetPl(${i})">Reset</button><button class="d sm" onclick="delPl(${i})">🗑</button></td></tr>`).join('')}</table>`:'<p class="mu">Chưa có người chơi. Người chơi được tạo tự động khi gõ lệnh Tu Tiên đầu tiên (ví dụ <code>!tt</code>).</p>'}</div>`}
async function savePl(i){const p=PL[i];await api('PUT','/api/tt/player/'+p.id,{realm:+$('pr'+i).value,tier:+$('pt'+i).value,dao:+$('pd'+i).value});PL=await api('GET','/api/tt/players');toast('✔ Đã cập nhật');draw()}
async function resetPl(i){if(!confirm('Reset người chơi này về Phàm Nhân?'))return;await api('PUT','/api/tt/player/'+PL[i].id,{reset:true});PL=await api('GET','/api/tt/players');draw()}
async function delPl(i){if(!confirm('Xóa người chơi?'))return;await api('DELETE','/api/tt/player/'+PL[i].id);PL=await api('GET','/api/tt/players');draw()}
// ================= MÔ PHỎNG =================
function tSim(){const side=(k,t)=>`<div class="card" style="flex:1;min-width:260px;margin:0"><b>${t}</b><div class="g2" style="margin-top:6px"><div>${lab('Cảnh giới','')}<select onchange="SIM.${k}.realm=+this.value;SIM.${k}.tier=1;draw()">${realmOpts().map(([a,b])=>`<option value="${a}" ${a==SIM[k].realm?'selected':''}>${esc(b)}</option>`).join('')}</select></div><div>${lab('Tầng','')}<select onchange="SIM.${k}.tier=+this.value">${(T.realms[SIM[k].realm].tierNames||[]).map((n,i)=>`<option value="${i+1}" ${i+1==SIM[k].tier?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div></div>`;
 return `<div class="hint">Mô phỏng dùng cấu hình <b>đã lưu</b> (bấm Lưu trước nếu mới sửa). Hai bên dùng toàn bộ khả năng đã mở khóa.</div><div class="r" style="align-items:stretch">${side('a','Bên A')}<div style="align-self:center;font-size:24px">⚔️</div>${side('b','Bên B')}</div>
 <p><button onclick="runSim()">▶ Chạy luận bàn</button></p>${SIMR?`<div class="log">${md(SIMR.text)}</div>`:''}`}
async function runSim(){try{SIMR=await api('POST','/api/tt/simulate',SIM);draw()}catch(e){toast('❌ '+e.message)}}
// ================= CÀI ĐẶT =================
function tSet(){const f=(k,t)=>`<div>${lab(t,'')}${inp('settings.'+k,{n:1})}</div>`;
 return `<div class="card"><h3 style="margin:0 0 8px">Cài đặt chung</h3><div class="g2">${f('slots','Số khả năng chọn tối đa')}${f('maxRounds','Số hiệp tối đa/trận')}${f('mpRegen','Hồi linh lực/hiệp (0–1)')}${f('trainRandom','Dao động tu vi/lần (0–1)')}${f('failLoss','Mất tu vi khi đột phá hỏng (0–1)')}${f('dummyScale','Độ mạnh tâm ma (×)')}${f('duelRewardX','Thưởng thắng (× 1 lần tu luyện)')}</div></div>
 <div class="card"><h3 style="margin:0 0 8px">Sao lưu / chuyển cấu hình</h3><div class="r"><button class="s" onclick="exportCfg()">⬇ Xuất JSON</button><label class="s" style="margin:0;background:#2a2a3d;padding:6px 13px;border-radius:8px;cursor:pointer;color:#fff;text-transform:none;font-size:14px">⬆ Nhập JSON<input type=file accept=".json" style="display:none" onchange="importCfg(this)"></label><button class="d" onclick="resetCfg()">♻ Khôi phục mặc định (cảnh giới, chỉ số, khả năng, menu, lệnh)</button></div><p class="mu">Người chơi không bị ảnh hưởng khi nhập/khôi phục.</p></div>
 <div class="card"><h3 style="margin:0 0 6px">Cách bot tính “tiến sát vô hạn”</h3><p class="mu" style="margin:0">Mọi chỉ số, tu vi, sát thương là một cặp <code>[a, b]</code> = <code>∞<sup>a</sup> × 10<sup>b</sup></code>. <b>a</b> là tầng tồn tại; <b>b</b> là log10 của độ lớn và có thể lên tới 10<sup>300</sup> nên chỉ số thực tế là <code>10^(10^300)</code>. So sánh theo thứ tự a rồi b: kẻ ở tầng ∞ cao hơn thắng tuyệt đối, đòn đánh từ tầng thấp không thể chạm tới. Cấp 3 (Chân Tiên → Đại La) bị khóa: tỉ lệ lên là 0, nhưng “trong 0 luôn có 100” — mỗi lần thử đột phá ở Đại Thừa sẽ tăng 1 đạo ngấn.</p></div>`}
function exportCfg(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(T,null,2)],{type:'application/json'}));a.download='tutien-config.json';a.click()}
function importCfg(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);for(const k of ['realms','stats','abilities','menus','commands','settings'])if(j[k])T[k]=j[k];dirty(true);draw();toast('Đã nhập — bấm Lưu để áp dụng')}catch{toast('File JSON sai')}})}
async function resetCfg(){if(!confirm('Khôi phục TOÀN BỘ cấu hình tu tiên về mặc định?'))return;try{const r=await api('PUT','/api/tt',{});T=r.tutien;dirty(false);toast('Đã khôi phục mặc định');draw()}catch(e){toast(e.message)}}
init();
</script></body></html>
